name: Deploy to Production (FTP)

# Memicu deployment otomatis setiap kali push ke branch master
on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: 🚀 Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      # Langkah 1: Mengambil kode terbaru dari repositori GitHub
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Langkah 2: Sync file ke Hosting via FTP
      - name: 📁 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || 'ftp.666.mikrosite.web.id' }}
          username: ${{ secrets.FTP_USERNAME || 'siwisata-balam@siwisata-balam.666.mikrosite.web.id' }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftp
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*/**
            **/db/**
            **/referensi/**
            **/*.sql
            **/Zzz/**
            **/README.md
            **/laporan/**
            **/@agents/**
            **/.env
